{% extends "base.html" %}

{% block title %}Delete Patient{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 text-center">
            <h4 class="fw-bold text-danger mb-3">Delete Patient</h4>
            <p class="text-secondary mb-4">
                Are you sure you want to delete <strong>{{ user.name }}</strong> (ID #{{ user.id }})?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="/" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
