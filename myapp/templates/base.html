<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Records{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            color: #333333;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-hospital {
            background-color: #0f766e;
        }
        .btn-hospital {
            background-color: #0f766e;
            color: #ffffff;
            border: none;
        }
        .btn-hospital:hover {
            background-color: #0d625b;
            color: #ffffff;
        }
        .card-custom {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <!-- Simple Hospital Navbar -->
    <nav class="navbar navbar-dark navbar-hospital shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <span class="me-1">&#10010;</span> Hospital Patient Records
            </a>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-light btn-sm">Patient List</a>
                <a href="/Add/" class="btn btn-light btn-sm text-dark fw-semibold">+ Add Patient</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
